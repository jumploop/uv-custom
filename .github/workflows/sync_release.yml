name: Sync UV Release to GitHub & Gitee

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Force build, installer tests, and release checks even when versions match'
        required: false
        default: false
        type: boolean
      replace_assets:
        description: 'Replace existing release assets after all installer tests pass'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: sync-uv-release
  cancel-in-progress: false

jobs:
  check_for_updates:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.compare_versions.outputs.proceed }}
      new_tag: ${{ steps.get_uv_version.outputs.tag }}
    steps:
      - name: Ensure jq is available
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi

      - name: Get latest uv release version
        id: get_uv_version
        run: |
          set -euo pipefail
          LATEST_UV_JSON=$(curl -fsSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/astral-sh/uv/releases/latest)
          LATEST_UV_TAG=$(jq -er '.tag_name' <<<"$LATEST_UV_JSON")
          [[ "$LATEST_UV_TAG" =~ ^[0-9A-Za-z._-]+$ ]] || {
            echo "Invalid upstream tag: $LATEST_UV_TAG" >&2
            exit 1
          }
          echo "tag=$LATEST_UV_TAG" >> "$GITHUB_OUTPUT"

      - name: Get latest GitHub local release version
        id: get_github_local_version
        run: |
          set -euo pipefail
          LATEST_GITHUB_TAG=$(curl -fsSL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/releases/latest |
            jq -er '.tag_name')
          echo "tag=$LATEST_GITHUB_TAG" >> "$GITHUB_OUTPUT"

      - name: Get latest Gitee local release version
        id: get_gitee_local_version
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: "jumploop"
          GITEE_REPO: "uv-custom"
        run: |
          set -euo pipefail
          API_URL="https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO/releases/latest"
          if [ -n "${GITEE_TOKEN:-}" ]; then
            API_URL="$API_URL?access_token=$GITEE_TOKEN"
          fi

          RESPONSE_FILE=$(mktemp)
          HTTP_CODE=$(curl -sS \
            -w '%{http_code}' \
            -H "Content-Type: application/json;charset=UTF-8" \
            -H "Accept: application/json" \
            -H "User-Agent: uv-custom-sync-release/2.0" \
            -o "$RESPONSE_FILE" \
            "$API_URL")

          RESPONSE=$(cat "$RESPONSE_FILE")
          rm -f "$RESPONSE_FILE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "请求 Gitee API 失败，HTTP 状态码: $HTTP_CODE" >&2
            echo "$RESPONSE" >&2
            exit 1
          fi

          if ! LATEST_GITEE_TAG=$(jq -er '.tag_name' <<<"$RESPONSE"); then
            echo "无法从 Gitee API 响应中解析 tag_name，原始返回如下：" >&2
            echo "$RESPONSE" >&2
            exit 1
          fi

          echo "tag=$LATEST_GITEE_TAG" >> "$GITHUB_OUTPUT"

      - name: Compare versions and decide to proceed
        id: compare_versions
        env:
          FORCE_SYNC: ${{ inputs.force || 'false' }}
          UPSTREAM_TAG: ${{ steps.get_uv_version.outputs.tag }}
          GITHUB_TAG: ${{ steps.get_github_local_version.outputs.tag }}
          GITEE_TAG: ${{ steps.get_gitee_local_version.outputs.tag }}
        run: |
          echo "Latest uv release: $UPSTREAM_TAG"
          echo "Latest GitHub local release: $GITHUB_TAG"
          echo "Latest Gitee local release: $GITEE_TAG"
          if [ "$FORCE_SYNC" = "true" ]; then
            echo "Forced run requested. Proceeding with build and installer tests."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          elif [ "$UPSTREAM_TAG" = "$GITHUB_TAG" ] && [ "$UPSTREAM_TAG" = "$GITEE_TAG" ]; then
            echo "All repositories are up-to-date. No new release needed."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version detected or repositories are out of sync. Proceeding with release."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  build_installers:
    needs: check_for_updates
    if: needs.check_for_updates.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    env:
      UV_DOWNLOAD_PROXY: https://gh-proxy.com
      UV_PYPI_MIRROR: https://pypi.tuna.tsinghua.edu.cn/simple
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate stable installer wrappers
        run: |
          chmod +x ./create_custom_uv_installer.sh
          ./create_custom_uv_installer.sh "${{ needs.check_for_updates.outputs.new_tag }}"

      - name: Prepare release assets
        run: |
          mkdir -p dist
          cp uv-installer-custom.sh uv-installer-custom.ps1 setup_hooks.sh setup_hooks.ps1 dist/

          RELEASE_TAG="${{ needs.check_for_updates.outputs.new_tag }}"
          GITHUB_REPO_URL="https://github.com/${{ github.repository }}"
          GITEE_REPO_URL="https://gitee.com/jumploop/uv-custom"

          cat > dist/release_notes.md <<EOF
          ## 🚀 uv 国内加速版 (同步自 uv官方版本 [$RELEASE_TAG](https://github.com/astral-sh/uv/releases/tag/$RELEASE_TAG))

          这是一个与 uv 官方版本同步的镜像版本，为国内用户提供了以下优化：

          - **稳定包装器**：生成器不再修改上游安装器内部代码，而是下载与目标版本完全匹配的官方安装器。
          - **下载加速**：所有 GitHub 下载链接均通过镜像代理，并在代理不可用时自动回退 GitHub 直连。
          - **预设镜像**：自动为您配置清华大学 PyPI 镜像和 Python 构建镜像，已有 \`uv.toml\` 不会被覆盖。
          - **发布门禁**：每个版本发布前会在 Linux、macOS、Windows 上执行真实安装与版本切换测试。
          - **灵活配置**：支持通过环境变量临时覆盖默认的下载代理、PyPI 镜像和 uv 版本。

          ---

          ### 快速安装

          请根据您的操作系统，在终端中运行以下对应的一键安装命令。**推荐使用 Gitee 源**。

          #### Gitee (推荐)
          \`\`\`sh
          # macOS / Linux
          curl -LsSf $GITEE_REPO_URL/releases/download/$RELEASE_TAG/uv-installer-custom.sh | sh
          \`\`\`
          \`\`\`powershell
          # Windows (PowerShell)
          powershell -ExecutionPolicy Bypass -c "irm $GITEE_REPO_URL/releases/download/$RELEASE_TAG/uv-installer-custom.ps1 | iex"
          \`\`\`

          #### GitHub (备用)
          \`\`\`sh
          # macOS / Linux
          curl -LsSf $GITHUB_REPO_URL/releases/download/$RELEASE_TAG/uv-installer-custom.sh | sh
          \`\`\`
          \`\`\`powershell
          # Windows (PowerShell)
          powershell -ExecutionPolicy Bypass -c "irm $GITHUB_REPO_URL/releases/download/$RELEASE_TAG/uv-installer-custom.ps1 | iex"
          \`\`\`

          ---

          ### 高级用法：自定义镜像源

          您可以在运行一键安装命令前，通过设置环境变量来临时指定下载代理和 PyPI 镜像，并选择下载不同的 uv 版本。

          - \`UV_DOWNLOAD_PROXY\`: 用于 \`uv\` 和 Python 的下载代理 (例如: \`https://gh-proxy.com\`)
          - \`UV_PYPI_MIRROR\`: PyPI 镜像源 (例如: \`https://mirrors.aliyun.com/pypi/simple/\`)
          - \`UV_VERSION\`: 选择下载不同的 uv 版本 (例如: \`0.7.19\`)

          #### macOS / Linux 示例
          \`\`\`sh
          export UV_DOWNLOAD_PROXY="https://gh-proxy.com";export UV_PYPI_MIRROR="https://mirrors.aliyun.com/pypi/simple/";export UV_VERSION="0.7.19"; \
          curl -LsSf $GITEE_REPO_URL/releases/download/$RELEASE_TAG/uv-installer-custom.sh | sh
          \`\`\`

          #### Windows (PowerShell) 示例
          \`\`\`powershell
          \$env:UV_DOWNLOAD_PROXY="https://gh-proxy.com"; \$env:UV_PYPI_MIRROR="https://mirrors.aliyun.com/pypi/simple/"; \$env:UV_VERSION="0.7.19"; \
          powershell -ExecutionPolicy Bypass -c "irm $GITEE_REPO_URL/releases/download/$RELEASE_TAG/uv-installer-custom.ps1 | iex"
          \`\`\`

          ---

          ### (可选) 配置 Conda/Mamba 环境联动

          如果您希望 \`uv\` 能够自动识别并管理当前激活的 Conda/Mamba 环境，可以运行以下对应的脚本来配置 Shell 钩子。

          #### Gitee (推荐)
          \`\`\`sh
          # macOS / Linux
          curl -LsSf $GITEE_REPO_URL/releases/download/$RELEASE_TAG/setup_hooks.sh | sh
          \`\`\`
          \`\`\`powershell
          # Windows (PowerShell)
          powershell -ExecutionPolicy Bypass -c "irm $GITEE_REPO_URL/releases/download/$RELEASE_TAG/setup_hooks.ps1 | iex"
          \`\`\`
          EOF

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: uv-custom-release
          path: dist/
          if-no-files-found: error
          retention-days: 3

  test_installers:
    needs:
      - check_for_updates
      - build_installers
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            installer: shell
          - os: macos-latest
            installer: shell
          - os: windows-latest
            installer: powershell
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          name: uv-custom-release
          path: dist

      - name: Test shell installer
        if: matrix.installer == 'shell'
        env:
          EXPECTED_VERSION: ${{ needs.check_for_updates.outputs.new_tag }}
          OLD_VERSION: '0.7.19'
        run: |
          chmod +x tests/test_shell_installer.sh
          tests/test_shell_installer.sh dist/uv-installer-custom.sh "$EXPECTED_VERSION"

      - name: Test PowerShell installer
        if: matrix.installer == 'powershell'
        env:
          EXPECTED_VERSION: ${{ needs.check_for_updates.outputs.new_tag }}
          OLD_VERSION: '0.7.19'
        run: |
          ./tests/test_powershell_installer.ps1 `
            -InstallerPath dist/uv-installer-custom.ps1 `
            -ExpectedVersion $env:EXPECTED_VERSION `
            -OldVersion $env:OLD_VERSION

  create_releases:
    needs:
      - check_for_updates
      - build_installers
      - test_installers
    if: needs.check_for_updates.outputs.proceed == 'true' && needs.test_installers.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download tested release assets
        uses: actions/download-artifact@v8
        with:
          name: uv-custom-release
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.check_for_updates.outputs.new_tag }}
          RELEASE_DIR: dist
          REPLACE_ASSETS: ${{ inputs.replace_assets || 'false' }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists on GitHub. Ensuring assets are present."
            if [ "$REPLACE_ASSETS" = "true" ]; then
              echo "Replacing release notes and existing assets."
              gh release edit "$RELEASE_TAG" --notes-file "$RELEASE_DIR/release_notes.md"
            fi
            EXISTING_GITHUB_ASSETS=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
            for asset in uv-installer-custom.sh uv-installer-custom.ps1 setup_hooks.sh setup_hooks.ps1; do
              if grep -Fxq "$asset" <<< "$EXISTING_GITHUB_ASSETS"; then
                if [ "$REPLACE_ASSETS" = "true" ]; then
                  echo "Replacing existing asset: $asset"
                  gh release upload "$RELEASE_TAG" "$RELEASE_DIR/$asset" --clobber
                else
                  echo "Skipping existing asset: $asset"
                fi
              else
                gh release upload "$RELEASE_TAG" "$RELEASE_DIR/$asset"
              fi
            done
          else
            echo "Creating GitHub release $RELEASE_TAG..."
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file "$RELEASE_DIR/release_notes.md" \
              "$RELEASE_DIR/uv-installer-custom.sh" \
              "$RELEASE_DIR/uv-installer-custom.ps1" \
              "$RELEASE_DIR/setup_hooks.sh" \
              "$RELEASE_DIR/setup_hooks.ps1"
          fi

      - name: Create Gitee Release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          RELEASE_TAG: ${{ needs.check_for_updates.outputs.new_tag }}
          RELEASE_DIR: dist
          REPLACE_ASSETS: ${{ inputs.replace_assets || 'false' }}
          GITEE_OWNER: "jumploop"
          GITEE_REPO: "uv-custom"
        run: |
          set -euo pipefail
          JSON_NOTES=$(jq -R -s '.' < "$RELEASE_DIR/release_notes.md")

          gitee_request() {
            local response
            response=$(curl -sS --fail "$@") || return 1
            printf '%s' "$response"
          }

          if gitee_request "https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO/tags/$RELEASE_TAG?access_token=$GITEE_TOKEN" > /dev/null; then
            echo "Tag $RELEASE_TAG already exists on Gitee. Skipping tag creation."
          else
            echo "Creating Gitee Tag..."
            gitee_request -X POST --header 'Content-Type: application/json;charset=UTF-8' \
              "https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO/tags" \
              -d "{\"access_token\":\"$GITEE_TOKEN\",\"tag_name\":\"$RELEASE_TAG\",\"refs\":\"main\",\"tag_message\":\"Release $RELEASE_TAG\"}" > /dev/null
          fi

          RELEASE_RESPONSE_FILE=$(mktemp)
          RELEASE_HTTP_CODE=$(curl -sS \
            -w '%{http_code}' \
            -o "$RELEASE_RESPONSE_FILE" \
            "https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO/releases/tags/$RELEASE_TAG?access_token=$GITEE_TOKEN") || {
              rm -f "$RELEASE_RESPONSE_FILE"
              echo "Failed to query Gitee release for tag $RELEASE_TAG." >&2
              exit 1
            }
          EXISTING_RELEASE_RESPONSE=$(cat "$RELEASE_RESPONSE_FILE")
          rm -f "$RELEASE_RESPONSE_FILE"
          case "$RELEASE_HTTP_CODE" in
            200) ;;
            404) EXISTING_RELEASE_RESPONSE='{}' ;;
            *)
              echo "Gitee release query failed with HTTP status $RELEASE_HTTP_CODE." >&2
              echo "$EXISTING_RELEASE_RESPONSE" >&2
              exit 1
              ;;
          esac
          RELEASE_ID=$(echo "$EXISTING_RELEASE_RESPONSE" | jq -r .id)

          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "No existing Gitee release found for tag $RELEASE_TAG. Creating a new one..."
            RELEASE_PAYLOAD=$(jq -n \
              --arg token "$GITEE_TOKEN" \
              --arg tag "$RELEASE_TAG" \
              --argjson notes "$JSON_NOTES" \
              '{access_token: $token, tag_name: $tag, name: $tag, body: $notes, target_commitish: "main"}')

            CREATE_RESPONSE=$(gitee_request -X POST --header 'Content-Type: application/json;charset=UTF-8' \
              "https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO/releases" -d "$RELEASE_PAYLOAD")

            RELEASE_ID=$(echo "$CREATE_RESPONSE" | jq -r .id)
            ASSET_COUNT=0
          else
            echo "Found existing Gitee release with ID: $RELEASE_ID."
            ASSET_COUNT=$(echo "$EXISTING_RELEASE_RESPONSE" | jq '.assets | length')
            echo "It has $ASSET_COUNT assets."
          fi

          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "Failed to create or find Gitee release."
            exit 1
          fi

          echo "Ensuring assets are uploaded to Gitee Release ID: $RELEASE_ID..."
          for asset in uv-installer-custom.sh uv-installer-custom.ps1 setup_hooks.sh setup_hooks.ps1; do
            if [ "$ASSET_COUNT" -gt 0 ] && echo "$EXISTING_RELEASE_RESPONSE" | jq -e --arg name "$asset" '.assets[] | select(.name == $name)' > /dev/null; then
              if [ "$REPLACE_ASSETS" = "true" ]; then
                ASSET_ID=$(echo "$EXISTING_RELEASE_RESPONSE" | jq -r --arg name "$asset" '.assets[] | select(.name == $name) | .id')
                if [ -z "$ASSET_ID" ] || [ "$ASSET_ID" = "null" ]; then
                  echo "Failed to find Gitee asset ID for $asset." >&2
                  exit 1
                fi
                echo "Replacing existing asset: $asset"
                gitee_request -X DELETE \
                  "https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO/releases/$RELEASE_ID/attach_files/$ASSET_ID?access_token=$GITEE_TOKEN" > /dev/null
              else
                echo "Skipping existing asset: $asset"
                continue
              fi
            fi
            echo "Uploading $asset..."
            gitee_request -X POST --header "Content-Type: multipart/form-data" \
              -F "access_token=$GITEE_TOKEN" \
              -F "file=@$RELEASE_DIR/$asset" \
              "https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO/releases/$RELEASE_ID/attach_files" > /dev/null
          done
          echo "All assets uploaded to Gitee."
